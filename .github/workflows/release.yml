# Builds the kiln binaries for every supported system and, for a version tag
# (v0.1.0, ...), publishes them as a GitHub release. The release text is the
# section of that version in CHANGELOG.md, which must exist before tagging.
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# Run by hand (Actions tab, "Run workflow") to build the archives without
# publishing: they are attached to the run as an artifact.
#
# Go compiles for every system from one Linux machine (no C code is involved).
# kiln-core and kiln-schema are public but not tagged yet, so they are checked out
# next to the CLI and joined in a Go workspace, as in ci.yml.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write       # for the build attestations
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: kiln-cli
      - uses: actions/checkout@v4
        with:
          repository: pixelpolishers/kiln-core
          path: kiln-core
      - uses: actions/checkout@v4
        with:
          repository: pixelpolishers/kiln-schema
          path: kiln-schema
      - uses: actions/setup-go@v5
        with:
          go-version-file: kiln-cli/go.mod
          cache: false
      - name: Take the release notes from CHANGELOG.md
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          # the section of this version: from its "## [x.y.z]" heading to the next "## [" heading,
          # without the link lines at the end of the file
          awk -v v="$version" '
            /^## \[/ { if (found) exit; if (index($0, "## [" v "]") == 1) found = 1; next }
            found && !/^\[[^]]+\]: / { print }
          ' kiln-cli/CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::CHANGELOG.md has no section (or an empty one) for version $version. Add '## [$version] - YYYY-MM-DD' with its changes and tag again."
            exit 1
          fi
          cat release-notes.md
      - name: Join the modules in a workspace
        run: go work init ./kiln-cli ./kiln-core ./kiln-schema
      - name: Test before releasing
        run: cd kiln-cli && go test -count=1 ./...
      - name: Build the archives
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="dev-${GITHUB_SHA::7}"
          fi
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/arm64 darwin/amd64 windows/amd64 windows/arm64 freebsd/amd64; do
            os="${target%/*}"; arch="${target#*/}"
            exe=kiln; [[ "$os" == windows ]] && exe=kiln.exe
            stage="$(mktemp -d)"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath \
              -ldflags "-s -w -X main.version=$version" -o "$stage/$exe" ./kiln-cli/cmd/kiln
            cp kiln-cli/LICENSE kiln-cli/README.md kiln-cli/CHANGELOG.md "$stage/"
            if [[ "$os" == windows ]]; then
              (cd "$stage" && zip -q "$GITHUB_WORKSPACE/dist/kiln_${os}_${arch}.zip" "$exe" LICENSE README.md CHANGELOG.md)
            else
              tar -C "$stage" -czf "dist/kiln_${os}_${arch}.tar.gz" "$exe" LICENSE README.md CHANGELOG.md
            fi
          done
          (cd dist && sha256sum kiln_* > SHA256SUMS)
          # The installers. For a release they get the checksums of that release baked in,
          # so a script can only ever install the files of its own release.
          cp kiln-cli/scripts/install.sh kiln-cli/scripts/install.ps1 dist/
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="$GITHUB_REF_NAME" python3 - <<'PY'
          import os
          tag = os.environ["TAG"]
          sums = open("dist/SHA256SUMS").read().strip()
          sh = open("dist/install.sh").read()
          sh = sh.replace('baked_version=""', 'baked_version="%s"' % tag, 1)
          sh = sh.replace('baked_sums=""', 'baked_sums="%s"' % sums, 1)
          open("dist/install.sh", "w").write(sh)
          ps = open("dist/install.ps1").read()
          ps = ps.replace("$bakedVersion = ''", "$bakedVersion = '%s'" % tag, 1)
          ps = ps.replace("$bakedSums = ''", "$bakedSums = @'\n%s\n'@" % sums, 1)
          open("dist/install.ps1", "w").write(ps)
          PY
          fi
          (cd dist && sha256sum install.sh install.ps1 >> SHA256SUMS && cat SHA256SUMS)
      - name: Check that the Linux binary reports its version
        run: |
          mkdir check && tar -C check -xzf dist/kiln_linux_amd64.tar.gz
          ./check/kiln version
      - name: Check the installers
        run: |
          sh -n dist/install.sh
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            grep -q "baked_version=\"$GITHUB_REF_NAME\"" dist/install.sh
            grep -q "kiln_linux_amd64.tar.gz" dist/install.sh
          fi
      - name: Attest where the files came from
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: kiln-binaries
          path: dist/*
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=""
          [[ "$GITHUB_REF_NAME" == *-* ]] && flags="--prerelease"
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
            --title "Kiln $GITHUB_REF_NAME" --notes-file release-notes.md $flags
