# Continuous integration: vet and test the CLI on Ubuntu (Debian family),
# Fedora (Red Hat family), macOS and Windows, and on ARM for Linux and Windows.
#
# kiln-core and kiln-schema are public but not tagged with versions yet, so the
# jobs check them out next to the CLI and join the three in a Go workspace.
# Replace this setup by a plain `go test ./...` once the modules are tagged.
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: tests (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu
            runner: ubuntu-latest
          - name: fedora
            runner: ubuntu-latest
            container: fedora:latest   # the Red Hat family; the author develops on Fedora
          - name: ubuntu-arm
            runner: ubuntu-24.04-arm
          - name: macos
            runner: macos-latest
          - name: windows
            runner: windows-latest
          - name: windows-arm
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Use the D drive for temporary files and Go's caches
        # The C drive of the Windows runners is slow for the many small files that
        # builds create; the D drive is much faster.
        if: runner.os == 'Windows'
        run: |
          if [ ! -d /d ]; then echo "no D drive on this runner, using C"; exit 0; fi
          mkdir -p /d/tmp /d/gocache /d/gomod
          echo 'TEMP=D:\tmp' >> "$GITHUB_ENV"
          echo 'TMP=D:\tmp' >> "$GITHUB_ENV"
          echo 'GOCACHE=D:\gocache' >> "$GITHUB_ENV"
          echo 'GOMODCACHE=D:\gomod' >> "$GITHUB_ENV"
      - name: Install git and the build tools the tests need
        if: matrix.container
        run: dnf install -y git gcc-c++ cmake make tcl perl-core which
      - uses: actions/checkout@v4
        with:
          path: kiln-cli
      - uses: actions/checkout@v4
        with:
          repository: pixelpolishers/kiln-core
          path: kiln-core
      - uses: actions/checkout@v4
        with:
          repository: pixelpolishers/kiln-schema
          path: kiln-schema
      - uses: actions/setup-go@v5
        with:
          go-version-file: kiln-cli/go.mod
          cache: false   # the step below caches the build cache too, which setup-go would not update
      - name: Find Go's caches
        id: gocache
        run: |
          echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "mod=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
      - name: Restore Go's caches
        # Go's build cache is keyed by content, so an old cache is always safe to
        # start from: restore the newest one for this system, save a new one at the end.
        uses: actions/cache@v4
        with:
          path: |
            ${{ steps.gocache.outputs.build }}
            ${{ steps.gocache.outputs.mod }}
          key: go-${{ matrix.name }}-${{ github.sha }}
          restore-keys: go-${{ matrix.name }}-
      - name: Join the modules in a workspace
        run: go work init ./kiln-cli ./kiln-core ./kiln-schema
      - name: Vet
        run: cd kiln-cli && go vet ./...
      - name: Test
        run: cd kiln-cli && go test -count=1 ./...

  installer:
    # The install scripts download the newest published release, check its checksum and
    # install it. This tests the scripts of the repository against real releases.
    name: install script (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Shell script
        if: runner.os != 'Windows'
        run: |
          KILN_INSTALL_DIR="$RUNNER_TEMP/kiln-bin" sh scripts/install.sh
          "$RUNNER_TEMP/kiln-bin/kiln" version
      - name: PowerShell script
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:KILN_INSTALL_DIR = "$env:RUNNER_TEMP\kiln-bin"
          & .\scripts\install.ps1
          & "$env:KILN_INSTALL_DIR\kiln.exe" version
      - name: Windows PowerShell 5.1 (the one that ships with Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $env:KILN_INSTALL_DIR = "$env:RUNNER_TEMP\kiln-bin51"
          & .\scripts\install.ps1
          & "$env:KILN_INSTALL_DIR\kiln.exe" version
