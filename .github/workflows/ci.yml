# Continuous integration: vet and test the CLI on Linux, macOS and Windows.
#
# The macOS and Windows jobs have never run: expect to fix things on the first
# runs. That is the point; it is how Windows and macOS support gets tested.
#
# kiln-core and kiln-schema are not published as tagged modules yet, so the job
# checks them out next to the CLI and joins the three in a Go workspace. The
# repositories are private: add a token that can read them as the repository
# secret KILN_REPO_TOKEN. Replace this setup by a plain `go test ./...` once the
# modules are tagged.
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: kiln-cli
      - uses: actions/checkout@v4
        with:
          repository: pixelpolishers/kiln-core
          path: kiln-core
          token: ${{ secrets.KILN_REPO_TOKEN }}
      - uses: actions/checkout@v4
        with:
          repository: pixelpolishers/kiln-schema
          path: kiln-schema
          token: ${{ secrets.KILN_REPO_TOKEN }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: kiln-cli/go.mod
          cache: false
      - name: Join the modules in a workspace
        shell: bash
        run: go work init ./kiln-cli ./kiln-core ./kiln-schema
      - name: Vet
        shell: bash
        run: cd kiln-cli && go vet ./...
      - name: Test
        shell: bash
        run: cd kiln-cli && go test ./...
